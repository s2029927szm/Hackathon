; FoodCompass 便携版配置。用记事本修改，保存后重新双击 Start-FoodCompass.cmd 生效。

[server]
; 127.0.0.1 = 仅本机访问；0.0.0.0 = 允许同一局域网的手机/电脑访问（需在防火墙提示中允许）
host = 127.0.0.1
; 端口被占用时改为其他端口，例如 8002
port = 8001
; 启动后自动打开浏览器：yes / no
open_browser = yes

[model]
; OpenAI 兼容模型接口地址（Ollama 默认 http://localhost:11434/v1）
base_url = http://localhost:11434/v1
model_id = gemma4:31b
; 单次模型请求超时（秒）
timeout = 120
